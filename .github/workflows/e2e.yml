# End to end: the real Rust host on the runner, the real Android app in an emulator.
name: E2E

on:
  push:
    branches: [main]
    paths: ["android/**", "host/**", "protocol/**", ".github/workflows/e2e.yml", "scripts/e2e-android.sh"]
  pull_request:
    paths: ["android/**", "host/**", "protocol/**", ".github/workflows/e2e.yml", "scripts/e2e-android.sh"]
  workflow_dispatch:

permissions:
  contents: write # only to publish screenshots to the ci/e2e-* branches

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 22 = oldest supported (Fire OS 5 era); 34 = modern.
        api-level: [22, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Build host
        working-directory: host
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p perritodeck-host

      - name: Start host (TLS, fixed test pairing code)
        run: |
          ./host/target/release/perritodeck-host --listen 127.0.0.1 --no-mdns \
            --data-dir "$RUNNER_TEMP/perritodeck-host" --pair-code 424242 < /dev/null > host.log 2>&1 &
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 46710; then
              fp=$(grep -oP 'fingerprint  \K[0-9A-F ]+' host.log | head -1 | xargs)
              echo "HOST_FINGERPRINT=$fp" >> "$GITHUB_ENV"
              echo "host fingerprint: $fp"
              exit 0
            fi
            sleep 0.5
          done
          echo "host did not start"; cat host.log; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_tablet
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/e2e-android.sh

      - name: Host log
        if: always()
        run: |
          cat host.log
          grep -q "key 2 down" host.log && echo "host saw the presses"

      - name: Publish screenshots to a branch (easy to browse on GitHub)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d e2e-out ] || exit 0
          cp host.log e2e-out/ 2>/dev/null || true
          cd e2e-out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# E2E API ${{ matrix.api-level }}\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\n' > README.md
          git add -A
          git commit -qm "E2E screenshots, API ${{ matrix.api-level }}, ${{ github.sha }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/e2e-api${{ matrix.api-level }}

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api${{ matrix.api-level }}
          path: |
            e2e-out/
            host.log
          if-no-files-found: warn
