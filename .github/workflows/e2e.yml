# End to end: the real Rust host on the runner, the real Android app in an emulator.
name: E2E

on:
  push:
    branches: [main]
    paths: ["android/**", "host/**", "protocol/**", ".github/workflows/e2e.yml", "scripts/e2e-android.sh"]
  pull_request:
    paths: ["android/**", "host/**", "protocol/**", ".github/workflows/e2e.yml", "scripts/e2e-android.sh"]
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only to publish screenshots to the ci/e2e-* branches

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Pushes run the oldest Android and the Fire 7 stand-in; all four weekly or by hand.
      # 22 = oldest supported. The test tablet is a Fire 7 (2019, KFMUWI): 1024x600 mdpi,
      # Fire OS 6 (API 25) or 7 (API 28); the Fire HD 10 is the common larger one.
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"name":"api22","api-level":22},{"name":"fire7","api-level":25,"screen-size":"1024x600","screen-density":160}]' || '[{"name":"api22","api-level":22},{"name":"api34","api-level":34},{"name":"fire7","api-level":25,"screen-size":"1024x600","screen-density":160},{"name":"firehd10","api-level":28,"screen-size":"1920x1200","screen-density":224}]') }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Linux build dependencies (Wayland input needs xkbcommon)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Build host
        working-directory: host
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p perritodeck-host

      - name: Start host (TLS, fixed test pairing code)
        run: |
          ./host/target/release/perritodeck-host --listen 127.0.0.1 --no-mdns \
            --data-dir "$RUNNER_TEMP/perritodeck-host" --pair-code 424242 < /dev/null > host.log 2>&1 &
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 46710; then
              fp=$(grep -oP 'fingerprint  \K[0-9A-F ]+' host.log | head -1 | xargs)
              echo "HOST_FINGERPRINT=$fp" >> "$GITHUB_ENV"
              echo "host fingerprint: $fp"
              exit 0
            fi
            sleep 0.5
          done
          echo "host did not start"; cat host.log; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_tablet
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: SCREEN_SIZE="${{ matrix.screen-size }}" SCREEN_DENSITY="${{ matrix.screen-density }}" E2E_NAME="${{ matrix.name }}" ./scripts/e2e-android.sh

      - name: Host log
        if: always()
        run: |
          cat host.log
          grep -q "pressed" host.log && echo "host saw the presses"

      - name: Publish screenshots to a branch (easy to browse on GitHub)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d e2e-out ] || exit 0
          cp host.log e2e-out/ 2>/dev/null || true
          cd e2e-out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# E2E ${{ matrix.name }} (API ${{ matrix.api-level }})\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCommit: ${{ github.sha }}\n' > README.md
          git add -A
          git commit -qm "E2E screenshots, ${{ matrix.name }}, ${{ github.sha }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/e2e-${{ matrix.name }}

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}
          path: |
            e2e-out/
            host.log
          if-no-files-found: warn
