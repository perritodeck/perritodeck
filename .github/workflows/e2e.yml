# End to end: the real Rust host on the runner, the real Android app in an emulator.
name: E2E

# Pushes to main and pull requests run this through ci.yml, when android/, host/, protocol/,
# scripts/e2e-android.sh or LICENSE (in the APK's licence list) change (the list is there).
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

# A newer run for the same branch makes older runs pointless, but each push to main is
# checked in full (see ci.yml). The group starts with this workflow's own name and then has
# github.workflow, which is the caller's name ("CI") when ci.yml calls this: so this never
# shares ci.yml's group (a deadlock), and a CI run by hand and a run from this workflow's own
# Run workflow button don't cancel each other.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Pushes run the oldest Android and the Fire 7 stand-in; all four weekly or by hand.
      # 22 = oldest supported. The test tablet is a Fire 7 (2019, KFMUWI): 1024x600 mdpi,
      # Fire OS 6 (API 25) or 7 (API 28); the Fire HD 10 is the common larger one.
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"name":"api22","api-level":22},{"name":"fire7","api-level":25,"screen-size":"1024x600","screen-density":160}]' || '[{"name":"api22","api-level":22},{"name":"api34","api-level":34},{"name":"fire7","api-level":25,"screen-size":"1024x600","screen-density":160},{"name":"firehd10","api-level":28,"screen-size":"1920x1200","screen-density":224}]') }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Linux build dependencies (Wayland input needs xkbcommon)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
      - name: Build host
        working-directory: host
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p perritodeck-host

      # --no-usb: the host would otherwise run `adb reverse` for the emulator as for a
      # tablet on a cable, and the app (which tries 127.0.0.1 first) would connect through
      # that tunnel rather than over the emulator's network at 10.0.2.2, where the test
      # switches the network off and on again.
      - name: Start host (TLS, fixed test pairing code)
        run: |
          ./host/target/release/perritodeck-host --listen 127.0.0.1 --no-mdns --no-usb \
            --data-dir "$RUNNER_TEMP/perritodeck-host" --pair-code 424242 < /dev/null > host.log 2>&1 &
          for i in $(seq 1 20); do
            if nc -z 127.0.0.1 46710; then
              fp=$(grep -oP 'fingerprint  \K[0-9A-F ]+' host.log | head -1 | xargs)
              echo "HOST_FINGERPRINT=$fp" >> "$GITHUB_ENV"
              echo "host fingerprint: $fp"
              exit 0
            fi
            sleep 0.5
          done
          echo "host did not start"; cat host.log; exit 1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_tablet
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: SCREEN_SIZE="${{ matrix.screen-size }}" SCREEN_DENSITY="${{ matrix.screen-density }}" E2E_NAME="${{ matrix.name }}" ./scripts/e2e-android.sh

      - name: Host log
        if: always()
        run: |
          cat host.log
          grep -q "pressed" host.log && echo "host saw the presses"

      # Screenshots, logcat and the host log: download them from the run's summary page
      # (Artifacts). Nothing is pushed back to the repository.
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.name }}
          path: |
            e2e-out/
            host.log
          if-no-files-found: warn
          retention-days: 30
