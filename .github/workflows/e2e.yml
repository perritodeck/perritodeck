# End to end: the real Rust host on the runner, the real Android app in an emulator.
name: E2E

on:
  push:
    branches: [main]
    paths: ["android/**", "host/**", "protocol/**", ".github/workflows/e2e.yml", "scripts/e2e-android.sh"]
  pull_request:
    paths: ["android/**", "host/**", "protocol/**", ".github/workflows/e2e.yml", "scripts/e2e-android.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 22 = oldest supported (Fire OS 5 era); 34 = modern.
        api-level: [22, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Build host
        working-directory: host
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo build --release --locked -p perritodeck-host

      - name: Start host
        run: |
          ./host/target/release/perritodeck-host > host.log 2>&1 &
          for i in $(seq 1 20); do nc -z 127.0.0.1 46710 && exit 0; sleep 0.5; done
          echo "host did not start"; cat host.log; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_tablet
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./scripts/e2e-android.sh

      - name: Host log
        if: always()
        run: |
          cat host.log
          grep -q "key 2 down" host.log && echo "host saw the presses"

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api${{ matrix.api-level }}
          path: |
            e2e-out/
            host.log
          if-no-files-found: warn
