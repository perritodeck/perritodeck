name: Protocol

on:
  push:
    branches: [main]
    paths: ["protocol/**", ".github/workflows/protocol.yml"]
  pull_request:
    paths: ["protocol/**", ".github/workflows/protocol.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 protocol/tools/validate.py protocol
