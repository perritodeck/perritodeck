name: Desktop app

# Pushes to main and pull requests run this through ci.yml, when host/, plugins/ (the app
# bundles them), docs/assets/ or release.yml change (the list is there): the UI checks, the app
# crate's checks and the bundles on Windows, Linux and macOS, and the real-app test on Linux.
# Also weekly and by hand.
on:
  workflow_call:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

# A newer run for the same branch makes older runs pointless, but each push to main is
# checked in full (see ci.yml). The group starts with this workflow's own name and then has
# github.workflow, which is the caller's name ("CI") when ci.yml calls this: so this never
# shares ci.yml's group (a deadlock), and a CI run by hand and a run from this workflow's own
# Run workflow button don't cancel each other.
concurrency:
  group: desktop-app-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: host/app

jobs:
  ui:
    name: UI checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=github,line
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: host/app/test-results
          retention-days: 7

  # The app's own Rust crate (host/app/src-tauri, a workspace of its own): fmt, clippy and its
  # tests, on Windows, Linux and macOS.
  # It embeds the built UI (../dist), hence npm run build first.
  app:
    name: App crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      # Toolchain version comes from host/rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # WebKitGTK and the tray: the app links them, and its test binary needs them to start.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host/app/src-tauri
      - run: npm ci
      - run: npm run build
      - name: Clippy
        shell: bash
        working-directory: host/app/src-tauri
        run: |
          set -o pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E '^(error|warning)|: (error|warning)' clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        shell: bash
        working-directory: host/app/src-tauri
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.txt || {
            grep -E 'panicked|FAILED|^error' test.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }

  # The real app on Linux, driven through WebDriver: pair fakedeck, edit a key, check
  # the profile file and the "tablet" both change, undo.
  real-app:
    name: Real app end to end (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      - name: Install toolchain
        working-directory: host
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev webkit2gtk-driver xvfb dbus-x11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            host
            host/app/src-tauri
      - run: cargo install tauri-driver --locked
      - name: Build fakedeck
        working-directory: host
        run: cargo build --locked -p perritodeck-fakedeck
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - name: Run
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: dbus-run-session -- xvfb-run -a node e2e/real-app.mjs

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      # Toolchain version comes from host/rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev patchelf
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: host/app/src-tauri
      # fmt, clippy and the tests run in the app job, on the same platforms.
      - run: npm ci
      - run: npm run build
      - name: Bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # Tauri merges only the main binary into the universal one; the script merges
            # perritodeck-mcp before bundling (scripts/lipo-universal-bins.sh).
            hook="{\"build\":{\"beforeBundleCommand\":\"bash $GITHUB_WORKSPACE/scripts/lipo-universal-bins.sh\"}}"
            npx tauri build --ci --target universal-apple-darwin --config "$hook"
          else
            npx tauri build --ci
          fi
      # Unsigned until Phase 6; for testing only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perritodeck-app-${{ runner.os }}
          path: |
            host/app/src-tauri/target/release/bundle/
            host/app/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
          retention-days: 14
