name: Desktop app

on:
  push:
    branches: [main]
    paths: ["host/**", ".github/workflows/desktop-app.yml"]
  pull_request:
    paths: ["host/**", ".github/workflows/desktop-app.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: host/app

jobs:
  ui:
    name: UI checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=github,line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: host/app/test-results
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      # Toolchain version comes from host/rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev patchelf
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host/app/src-tauri
      - run: npm ci
      - run: npm run build
      - name: Clippy
        shell: bash
        working-directory: host/app/src-tauri
        run: |
          set -o pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E '^(error|warning)|: (error|warning)' clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npx tauri build --ci --target universal-apple-darwin
          else
            npx tauri build --ci
          fi
      # Unsigned until Phase 6; for testing only.
      - uses: actions/upload-artifact@v4
        with:
          name: perritodeck-app-${{ runner.os }}
          path: |
            host/app/src-tauri/target/release/bundle/
            host/app/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
          retention-days: 14
