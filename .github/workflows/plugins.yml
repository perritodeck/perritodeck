name: Plugins

# Pushes to main and pull requests run this through ci.yml, when plugins/ or website/ change
# (test_build_catalog.py checks website/ for anything the site's Content-Security-Policy would
# block), or the two docs the tests read (the list is there): on Linux and Windows, where the
# clipboard, windows, sdk-python, sysmon and soundboard plugins have tests of their own. macOS
# as well weekly, or by hand.
on:
  workflow_call:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

# A newer run for the same branch makes older runs pointless, but each push to main is
# checked in full (see ci.yml). The group starts with this workflow's own name and then has
# github.workflow, which is the caller's name ("CI") when ci.yml calls this: so this never
# shares ci.yml's group (a deadlock), and a CI run by hand and a run from this workflow's own
# Run workflow button don't cancel each other.
concurrency:
  group: plugins-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Windows has no time zone database of its own, so the clock plugin's tests of zone
      # names need Python's tzdata package there, as people who use them on Windows do.
      - if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check tzdata==2026.5
      # SDKs, first-party plugins, and the bundled SDK copies matching the SDK. It also
      # runs test_build_catalog.py, which checks website/ for anything the site's
      # Content-Security-Policy would block. "python", not python3: setup-python provides
      # that name on Windows too.
      - run: python plugins/test_all.py
