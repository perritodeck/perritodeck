name: Plugins

on:
  push:
    branches: [main]
    paths: ["plugins/**", ".github/workflows/plugins.yml"]
  pull_request:
    paths: ["plugins/**", ".github/workflows/plugins.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SDKs, first-party plugins, and the bundled SDK copies matching the SDK.
      - run: python3 plugins/test_all.py
