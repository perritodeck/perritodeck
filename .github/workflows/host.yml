name: Host

on:
  push:
    branches: [main]
    paths: ["host/**", "protocol/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", "protocol/**", ".github/workflows/host.yml"]
  # Linux and macOS cost more minutes (macOS ten times Linux); run them weekly or by hand.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: host

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Toolchain version comes from host/rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux build dependencies (Wayland input needs xkbcommon)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            # Surface the first errors as annotations so they're readable without the full log.
            grep -E '^(error|warning)|: (error|warning)' clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.txt || {
            grep -E 'panicked|FAILED|^error' test.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
