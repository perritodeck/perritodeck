name: Host

# Pushes to main and pull requests run this through ci.yml, when host/, protocol/ or plugins/
# change (the list is there): Windows only. Linux and macOS cost more minutes (macOS ten times
# Linux), so all three run weekly or by hand.
on:
  workflow_call:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

# A newer run for the same branch makes older runs pointless, but each push to main is
# checked in full (see ci.yml). The group starts with this workflow's own name and then has
# github.workflow, which is the caller's name ("CI") when ci.yml calls this: so this never
# shares ci.yml's group (a deadlock), and a CI run by hand and a run from this workflow's own
# Run workflow button don't cancel each other.
concurrency:
  group: host-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: host

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Toolchain version comes from host/rust-toolchain.toml.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux build dependencies (Wayland input needs xkbcommon)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev
      # The Stream Deck plugin tests (host/crates/sdcompat/tests/plugins.rs) run a Node.js
      # plugin and need Node 22 or newer.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            # Surface the first errors as annotations so they're readable without the full log.
            grep -E '^(error|warning)|: (error|warning)' clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Test
        shell: bash
        env:
          # Without Node the Stream Deck plugin tests fail here rather than skip.
          PERRITODECK_REQUIRE_NODE: "1"
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.txt || {
            grep -E 'panicked|FAILED|^error' test.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
