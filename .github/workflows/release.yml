# Builds the release files for a version tag and puts them in a DRAFT GitHub Release.
# Nothing is published until a maintainer reviews the draft and presses "Publish release".
# What a release carries is the SHIP list below; everything else builds only by hand.
#
# Runs only when a v*.*.* tag is pushed, or by hand (Actions → Release → Run workflow),
# never on ordinary pushes: a run costs Windows minutes (twice Linux), and with "untested"
# ticked macOS minutes too (ten times Linux).
# The Android APK must be signed for a tag build, or a manual run that publishes: without the
# key those fail. A manual run without "publish" builds perrito-X.Y.Z-unsigned.apk instead.
# Apple and Windows signing are optional; without their secrets those builds are unsigned.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
      publish:
        description: "Also create or update the draft GitHub Release (off: build only and keep the files as workflow artifacts)"
        type: boolean
        default: false
      untested:
        description: "Also build what doesn't ship yet (anything not in SHIP at the top of release.yml), to test it. Workflow artifacts only, so leave publish unticked"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # SHIP: what a release publishes, besides the files every release has (the Android APK,
  # SHA256SUMS, third-party-licenses.txt and the plugin catalogue zip). v0.1.0 is Windows and
  # Android only (decision D5, 2026-10-15; docs/releasing.md). The rest joins a later release
  # once it's tested on real hardware. A tag build runs only the build jobs for what's listed,
  # so a platform that isn't listed can't fail the release. A manual run with "untested" ticked
  # builds the rest too, to test it.
  # To ship one, add its name here, and update the website pages that "Launch day" in
  # docs/website.md lists (download links on website/download.html, and the "not yet" lines):
  #   windows-nsis  perritodeck-X.Y.Z-windows-x64-setup.exe (per user, no admin needed)
  #   windows-msi   perritodeck-X.Y.Z-windows-x64.msi (per machine; never for a version with
  #                 a suffix like 0.3.0-rc.1, because MSI versions must be numeric)
  #   macos         perritodeck-X.Y.Z-macos-universal.dmg
  #   linux         perritodeck-X.Y.Z-linux-x86_64.AppImage, -linux-amd64.deb, -linux-x86_64.rpm
  #   cli-windows   perritodeck-host-X.Y.Z-windows-x86_64.zip    (the command-line host)
  #   cli-linux     perritodeck-host-X.Y.Z-linux-x86_64.tar.gz
  #   cli-macos     perritodeck-host-X.Y.Z-macos-universal.tar.gz
  SHIP: windows-nsis

# bash -eo pipefail: a failing command anywhere in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  check-version:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      ships: ${{ steps.scope.outputs.ships }}
      desktop: ${{ steps.scope.outputs.desktop }}
      cli: ${{ steps.scope.outputs.cli }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: The tag must match every version in the repository
        run: |
          version="${TAG#v}"
          python3 scripts/release-version.py --check "$version"
          code=$(grep -oP '^\s*versionCode = \K\d+' android/app/build.gradle.kts)
          case "$version" in 0.*|*-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # Turns SHIP (top of this file) into the desktop and command-line build matrices. A tag
      # build, and a manual run that publishes, build what ships and nothing else. A manual run
      # with "untested" ticked builds everything, as workflow artifacts only.
      - id: scope
        name: What this run builds
        shell: python3 {0}
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}
          UNTESTED: ${{ inputs.untested }}
        run: |
          import json, os, sys

          # Every desktop and command-line build, and the SHIP name of each file it makes.
          # Linux builds run on the oldest supported Ubuntu, so they work with glibc 2.35+.
          DESKTOP = [
              {"name": "windows", "os": "windows-latest", "target": "",
               "bundles": {"nsis": "windows-nsis", "msi": "windows-msi"}},
              {"name": "linux", "os": "ubuntu-22.04", "target": "",
               "bundles": {"deb": "linux", "rpm": "linux", "appimage": "linux"}},
              {"name": "macos", "os": "macos-latest", "target": "universal-apple-darwin",
               "bundles": {"app": "macos", "dmg": "macos"}},
          ]
          CLI = [
              {"name": "linux-x86_64", "os": "ubuntu-22.04", "ship": "cli-linux"},
              {"name": "windows-x86_64", "os": "windows-latest", "ship": "cli-windows"},
              {"name": "macos-universal", "os": "macos-latest", "ship": "cli-macos"},
          ]
          known = {n for d in DESKTOP for n in d["bundles"].values()} | {c["ship"] for c in CLI}

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          ship = list(dict.fromkeys(os.environ["SHIP"].split()))
          unknown = sorted(set(ship) - known)
          if unknown:
              fail(f"SHIP names {', '.join(unknown)}, which this workflow doesn't build. It knows {', '.join(sorted(known))}.")
          untested = os.environ["UNTESTED"] == "true"
          if untested and os.environ["PUBLISHING"] == "true":
              fail('"untested" builds files that don\'t ship, so it works only with "publish" unticked.')
          build = set(known) if untested else set(ship)
          ships = set(ship)
          # MSI versions must be numeric, so a version with a suffix, like 1.2.0-rc.1, has no
          # MSI. A plain 0.x version is still marked pre-release on GitHub, and keeps its MSI.
          if "-" in os.environ["VERSION"] and "windows-msi" in build:
              build.discard("windows-msi")
              ships.discard("windows-msi")
              print(f"::notice::No MSI for {os.environ['VERSION']}: MSI versions must be numeric. Windows gets the NSIS installer only.")

          desktop = []
          for d in DESKTOP:
              bundles = [b for b, n in d["bundles"].items() if n in build]
              if bundles:
                  desktop.append({"name": d["name"], "os": d["os"], "target": d["target"], "bundles": ",".join(bundles)})
          cli = [{"name": c["name"], "os": c["os"]} for c in CLI if c["ship"] in build]

          shipping = " ".join(n for n in ship if n in ships)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"ships={shipping}\n")
              # Empty when there's nothing to build, which skips the job: an empty matrix is an error.
              out.write(f"desktop={json.dumps({'include': desktop}) if desktop else ''}\n")
              out.write(f"cli={json.dumps({'include': cli}) if cli else ''}\n")
          desktop_builds = ", ".join("%s (%s)" % (d["name"], d["bundles"]) for d in desktop) or "none"
          cli_builds = ", ".join(c["name"] for c in cli) or "none"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Ships: {shipping or 'nothing'}, plus the APK, the licences and the plugin catalogue.\n\n")
              summary.write(f"Desktop builds: {desktop_builds}. Command-line builds: {cli_builds}.\n")

  android:
    name: Android APK
    needs: check-version
    runs-on: ubuntu-latest
    # Off until the repository is public. Then create a "release" environment that only v* tags
    # may use, with a required reviewer, move the three signing secrets into it and turn this
    # line on (docs/releasing.md). Not before: the environment doesn't exist yet, and a private
    # repository on the Free plan can't have one, so naming it now would protect nothing and
    # could stop the job.
    # environment: release
    timeout-minutes: 30
    outputs:
      cert_sha256: ${{ steps.collect.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # Read-only: a release uses the Gradle cache main's builds saved and adds nothing to it.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true
      # The three signing secrets and the PERRITO_KEY_ALIAS variable: all of them, or none. A tag
      # build, or a manual run that publishes, must be signed: Android won't install an unsigned
      # APK, and the download page links to the signed one. The alias is a repository variable
      # because it isn't secret, and as a secret every "perrito" in the log would show as ***.
      - name: Restore the signing key
        id: key
        env:
          PERRITO_KEYSTORE_BASE64: ${{ secrets.PERRITO_KEYSTORE_BASE64 }}
          PERRITO_KEYSTORE_PASSWORD: ${{ secrets.PERRITO_KEYSTORE_PASSWORD }}
          PERRITO_KEY_PASSWORD: ${{ secrets.PERRITO_KEY_PASSWORD }}
          PERRITO_KEY_ALIAS: ${{ vars.PERRITO_KEY_ALIAS }}
          MUST_SIGN: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          missing=()
          for name in PERRITO_KEYSTORE_BASE64 PERRITO_KEYSTORE_PASSWORD PERRITO_KEY_PASSWORD PERRITO_KEY_ALIAS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            ks="$RUNNER_TEMP/release.p12"
            # Spaces and line endings are dropped first, in case the secret was piped in with one.
            printf '%s' "$PERRITO_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$ks"
            # Stops here with a plain message if the password or the alias is wrong.
            keytool -list -keystore "$ks" -storepass:env PERRITO_KEYSTORE_PASSWORD -alias "$PERRITO_KEY_ALIAS" > /dev/null || {
              echo "::error::The keystore in PERRITO_KEYSTORE_BASE64 doesn't open with PERRITO_KEYSTORE_PASSWORD, or has no key named \"$PERRITO_KEY_ALIAS\" (the PERRITO_KEY_ALIAS variable)."
              exit 1
            }
            echo "PERRITO_KEYSTORE=$ks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -ne 4 ]; then
            echo "::error::Only $((4 - ${#missing[@]})) of the four Android signing settings are set; missing: ${missing[*]}. Set the secrets PERRITO_KEYSTORE_BASE64, PERRITO_KEYSTORE_PASSWORD and PERRITO_KEY_PASSWORD and the repository variable PERRITO_KEY_ALIAS, or none of them (docs/releasing.md)."
            exit 1
          elif [ "$MUST_SIGN" = true ]; then
            echo "::error::No Android signing key is set up. A tag build, or a manual run that publishes, must be signed (docs/releasing.md). To try the build without the key, run the workflow by hand with \"publish\" unticked."
            exit 1
          else
            echo "::warning::No Android signing key is set up, so this run builds perrito-X.Y.Z-unsigned.apk, which Android won't install. It can't be published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      # --no-configuration-cache: the configuration cache would keep the passwords on disk.
      - name: Build release APK and bundle
        working-directory: android
        env:
          PERRITO_KEYSTORE_PASSWORD: ${{ secrets.PERRITO_KEYSTORE_PASSWORD }}
          PERRITO_KEY_PASSWORD: ${{ secrets.PERRITO_KEY_PASSWORD }}
          PERRITO_KEY_ALIAS: ${{ vars.PERRITO_KEY_ALIAS }}
        run: ./gradlew --no-daemon --no-configuration-cache testReleaseUnitTest assembleRelease bundleRelease
      - name: Delete the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Collect and check the signature
        id: collect
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          SIGNED: ${{ steps.key.outputs.signed }}
          # Optional repository variable: the release certificate's SHA-256 (colons and case don't matter).
          EXPECTED_CERT: ${{ vars.PERRITO_CERT_SHA256 }}
        run: |
          mkdir -p dist play
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::Expected one release APK, found ${#apks[@]}"; exit 1; }
          if [ "$SIGNED" != true ]; then
            case "${apks[0]}" in
              *-unsigned.apk) cp "${apks[0]}" "dist/perrito-$VERSION-unsigned.apk" ;;
              *) echo "::error::No key was given, but Gradle built a signed APK (${apks[0]})."; exit 1 ;;
            esac
          else
            case "${apks[0]}" in
              *-unsigned.apk) echo "::error::The signing key is set up, but Gradle built an unsigned APK."; exit 1 ;;
            esac
            apk="dist/perrito-$VERSION.apk"
            cp "${apks[0]}" "$apk"
            # Exits non-zero if a signature doesn't verify, including on Android 5.1 (API 22).
            apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            report="$RUNNER_TEMP/apksigner.txt"
            "$apksigner" verify --verbose --print-certs --min-sdk-version 22 "$apk" > "$report"
            # Left out of the log: v1 notes that some META-INF/ files aren't covered by the JAR
            # signature. The v2 signature covers the whole file.
            grep -v '^WARNING: META-INF/' "$report" || true
            for scheme in 'v1 scheme (JAR signing)' 'v2 scheme (APK Signature Scheme v2)'; do
              grep -qxF "Verified using $scheme: true" "$report" || {
                echo "::error::The APK isn't signed with the $scheme. Android 5.1 and 6 need v1, Android 7 and newer check v2."
                exit 1
              }
            done
            grep -qxF 'Number of signers: 1' "$report" || { echo "::error::Expected exactly one signer."; exit 1; }
            # "Signer #1 certificate SHA-256 digest: <hex>" in older build tools, "V2 Signer: ..." in newer.
            mapfile -t certs < <(sed -nE 's/^.*[Ss]igner.* certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' "$report" | sort -u)
            [ "${#certs[@]}" -eq 1 ] || { echo "::error::Expected one certificate SHA-256 in the apksigner output, found ${#certs[@]}."; exit 1; }
            cert="${certs[0]}"
            expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ': \t\r\n' | tr 'A-F' 'a-f')
            if [ -n "$expected" ]; then
              [ "$cert" = "$expected" ] || {
                echo "::error::The APK is signed with certificate SHA-256 $cert, but the PERRITO_CERT_SHA256 variable says $expected. Are the secrets holding the wrong key?"
                exit 1
              }
              echo "The certificate matches PERRITO_CERT_SHA256."
            else
              echo "::warning::The PERRITO_CERT_SHA256 variable isn't set, so the certificate wasn't compared with the known one."
            fi
            echo "cert_sha256=$cert" >> "$GITHUB_OUTPUT"
            echo "Android signing certificate SHA-256: \`$cert\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The App Bundle is only for Google Play; it stays a workflow artifact.
          cp android/app/build/outputs/bundle/release/*.aab "play/perrito-$VERSION.aab"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: play-bundle
          path: play/
          if-no-files-found: error

  licences:
    name: Third-party licence texts
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      # The compiler version comes from host/rust-toolchain.toml.
      - name: Toolchain
        working-directory: host
        run: rustup show active-toolchain || rustup toolchain install
      # --full copies each dependency's own LICENSE/NOTICE files, so the crate sources
      # (both workspaces, every target platform) and node_modules must be on disk first.
      # Nothing is built and no install scripts run.
      - name: Fetch dependencies
        run: |
          (cd host && cargo fetch --locked)
          (cd host/app/src-tauri && cargo fetch --locked)
          (cd host/app && npm ci --ignore-scripts)
      # --check fails the release if THIRD_PARTY_NOTICES.md no longer matches the dependencies.
      # A fixed PYTHONHASHSEED keeps the texts in the same order, so a re-run gives the same bytes.
      - name: Collect the licence texts
        working-directory: host
        env:
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p ../dist
          python3 ../scripts/third-party-notices.py --check --full ../dist/third-party-licenses.txt
      # Attached to the release as it is, and copied into the command-line archives and the
      # desktop installers.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-licences
          path: dist/third-party-licenses.txt
          if-no-files-found: error

  cli:
    name: Command-line host (${{ matrix.name }})
    needs: [check-version, licences]
    # Skipped when SHIP has no cli-* name and "untested" isn't ticked, as for v0.1.0.
    if: needs.check-version.outputs.cli != ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # linux-x86_64, windows-x86_64 and macos-universal, as SHIP and "untested" choose
      # (check-version's "What this run builds" step).
      matrix: ${{ fromJSON(needs.check-version.outputs.cli) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      # Outside dist/, so it goes into the archive only and isn't uploaded a second time.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-licences
          path: licences
      - name: Linux build dependencies (Wayland input needs xkbcommon)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev
      # The compiler version comes from host/rust-toolchain.toml.
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ "${{ matrix.name }}" = macos-universal ]; then rustup target add x86_64-apple-darwin aarch64-apple-darwin; fi
      - name: Build
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          out="../dist/perritodeck-host-$VERSION-$NAME"
          mkdir -p "$out"
          bins="perritodeck-host perritodeck-mcp perritodeck-fakedeck"
          if [ "$NAME" = macos-universal ]; then
            cargo build --release --locked --target x86_64-apple-darwin --target aarch64-apple-darwin
            for b in $bins; do lipo -create -output "$out/$b" "target/x86_64-apple-darwin/release/$b" "target/aarch64-apple-darwin/release/$b"; done
          else
            cargo build --release --locked
            ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
            for b in $bins; do cp "target/release/$b$ext" "$out/"; done
          fi
          cp ../LICENSE ../licences/third-party-licenses.txt README.md "$out/"
          cd ../dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -bd "$(basename "$out").zip" "$(basename "$out")" > /dev/null
          else
            tar czf "$(basename "$out").tar.gz" "$(basename "$out")"
          fi
          rm -rf "$(basename "$out")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: [check-version, licences]
    # Skipped only when SHIP has no desktop file and "untested" isn't ticked.
    if: needs.check-version.outputs.desktop != ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # windows (nsis, msi), linux (deb, rpm, appimage) and macos (app, dmg), as SHIP and
      # "untested" choose (check-version's "What this run builds" step). For v0.1.0 a tag
      # builds windows with nsis only.
      matrix: ${{ fromJSON(needs.check-version.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: host/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      # Next to tauri.conf.json, where the --config below picks it up for the installers.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-licences
          path: host/app/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/app/package-lock.json
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev patchelf
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Build and bundle
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
          # linuxdeploy (AppImage) is itself an AppImage; this avoids needing FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # macOS signing: a Developer ID Application certificate (.p12, base64) and its name.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarisation with an App Store Connect API key (.p8, base64).
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          # Empty variables would make the bundler try to sign or notarise and fail, so a
          # missing secret means "skip that step", never "fail the release".
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Signing with the Developer ID certificate."
            if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
              echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
              echo "Notarising."
            else
              echo "::warning::No notarisation key configured; the app is signed but not notarised."
              unset APPLE_API_ISSUER APPLE_API_KEY
            fi
          else
            [ "$RUNNER_OS" = macOS ] && echo "::warning::No Apple certificate configured; the app is ad-hoc signed only, so Gatekeeper will warn."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY
          fi
          unset APPLE_API_KEY_P8_BASE64
          # Windows code signing isn't set up yet (see docs/releasing.md); installers are unsigned.

          # A version with a suffix (like 1.2.0-rc.1) never gets "msi" in BUNDLES: check-version
          # leaves it out, because MSI versions must be numeric.
          # Puts third-party-licenses.txt in the app's resource folder. Tauri merges --config
          # into tauri.conf.json as a JSON merge patch, so the plugin resources stay as they are.
          # It's added here rather than in tauri.conf.json because the file exists only in CI.
          licences='{"bundle":{"resources":{"third-party-licenses.txt":"third-party-licenses.txt"}}}'
          args=(--ci --bundles "$BUNDLES" --config "$licences")
          [ -n "$TARGET" ] && args+=(--target "$TARGET")
          npx tauri build "${args[@]}"
      - name: Collect
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          b=src-tauri/target/release/bundle
          [ -n "$TARGET" ] && b="src-tauri/target/$TARGET/release/bundle"
          out=../../dist
          mkdir -p "$out"
          shopt -s nullglob
          # Copy the one file matching a pattern under a stable, versioned name.
          one() {
            # shellcheck disable=SC2206 # $1 is a glob on purpose
            local files=("$b"/$1)
            [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected one $1, found ${#files[@]}"; exit 1; }
            cp "${files[0]}" "$out/$2"
          }
          # Was this bundle asked for? Each one that was must be there.
          built() { [[ ",$BUNDLES," == *",$1,"* ]]; }
          case "$RUNNER_OS" in
            Windows)
              if built nsis; then one 'nsis/*-setup.exe' "perritodeck-$VERSION-windows-x64-setup.exe"; fi
              if built msi; then one 'msi/*.msi' "perritodeck-$VERSION-windows-x64.msi"; fi
              ;;
            Linux)
              one 'deb/*.deb' "perritodeck-$VERSION-linux-amd64.deb"
              one 'rpm/*.rpm' "perritodeck-$VERSION-linux-x86_64.rpm"
              one 'appimage/*.AppImage' "perritodeck-$VERSION-linux-x86_64.AppImage"
              ;;
            macOS)
              one 'dmg/*.dmg' "perritodeck-$VERSION-macos-universal.dmg"
              ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  catalogue:
    name: Plugin catalogue
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: Build
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          python3 plugins/build_catalog.py "$RUNNER_TEMP/plugins"
          mkdir dist
          (cd "$RUNNER_TEMP/plugins" && zip -X -q -r "$GITHUB_WORKSPACE/dist/perritodeck-$VERSION-plugin-catalogue.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-catalogue
          path: dist/
          if-no-files-found: error

  publish:
    name: Draft GitHub Release
    needs: [check-version, licences, android, cli, desktop, catalogue]
    # For a tag, or a manual run with "publish" ticked. Every job it needs must succeed, except
    # that the command-line and desktop jobs may be skipped when SHIP lists nothing of theirs.
    # A publishing run never builds what doesn't ship, so every leg that ran is one that ships.
    if: >-
      !cancelled()
      && (github.event_name == 'push' || inputs.publish)
      && needs.check-version.result == 'success'
      && needs.licences.result == 'success'
      && needs.android.result == 'success'
      && needs.catalogue.result == 'success'
      && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
      && (needs.cli.result == 'success' || needs.cli.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # The draft gets what SHIP lists plus the files every release has, and nothing else.
      - name: Check the files
        working-directory: dist
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          SHIPS: ${{ needs.check-version.outputs.ships }}
        run: |
          v="$VERSION"
          expected=("perrito-$v.apk" "third-party-licenses.txt" "perritodeck-$v-plugin-catalogue.zip")
          for name in $SHIPS; do
            case "$name" in
              windows-nsis) expected+=("perritodeck-$v-windows-x64-setup.exe") ;;
              windows-msi) expected+=("perritodeck-$v-windows-x64.msi") ;;
              macos) expected+=("perritodeck-$v-macos-universal.dmg") ;;
              linux) expected+=("perritodeck-$v-linux-x86_64.AppImage" "perritodeck-$v-linux-amd64.deb" "perritodeck-$v-linux-x86_64.rpm") ;;
              cli-linux) expected+=("perritodeck-host-$v-linux-x86_64.tar.gz") ;;
              cli-windows) expected+=("perritodeck-host-$v-windows-x86_64.zip") ;;
              cli-macos) expected+=("perritodeck-host-$v-macos-universal.tar.gz") ;;
              *) echo "::error::No file names are known for \"$name\" in SHIP."; exit 1 ;;
            esac
          done
          if ! diff <(printf '%s\n' "${expected[@]}" | sort) <(ls -1A | sort); then
            echo "::error::The files to attach aren't the ones SHIP lists. Lines with < are missing, lines with > shouldn't be there."
            exit 1
          fi
          printf '%s\n' "${expected[@]}"
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          CODE: ${{ needs.check-version.outputs.code }}
          CERT: ${{ needs.android.outputs.cert_sha256 }}
          SHIPS: ${{ needs.check-version.outputs.ships }}
        run: |
          # The Android job only lets a publishing run through with a signed APK.
          [ -n "$CERT" ] || { echo "::error::The Android job reported no certificate fingerprint."; exit 1; }
          # keytool and some apps show the same fingerprint in capitals with colons.
          cert_colons=$(printf '%s' "$CERT" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          ships() { [[ " $SHIPS " == *" $1 "* ]]; }
          {
            echo "## Downloads"
            echo
            echo "| | File |"
            echo "|---|---|"
            # A row for each platform SHIP lists, then the files every release has.
            if ships windows-nsis; then echo "| Windows 10/11 | \`perritodeck-$VERSION-windows-x64-setup.exe\` (installs for you, no admin needed) |"; fi
            if ships windows-msi; then echo "| Windows 10/11, for all users | \`perritodeck-$VERSION-windows-x64.msi\` |"; fi
            if ships macos; then echo "| macOS 10.15+ (Intel and Apple silicon) | \`perritodeck-$VERSION-macos-universal.dmg\` |"; fi
            if ships linux; then echo "| Linux x86_64 | \`.AppImage\`, \`.deb\` (Debian, Ubuntu) or \`.rpm\` (Fedora, openSUSE) |"; fi
            echo "| Android 5.1+ | \`perrito-$VERSION.apk\` |"
            if [[ " $SHIPS " == *" cli-"* ]]; then echo "| Command-line host | \`perritodeck-host-$VERSION-<os>\` archives |"; fi
            echo "| Plugin catalogue | \`perritodeck-$VERSION-plugin-catalogue.zip\` (what perritodeck.dev/plugins/ serves) |"
            echo "| Licences | \`third-party-licenses.txt\`: the licence texts of the open-source code PerritoDeck is built on |"
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. How to verify, and what an unsigned build looks like on each OS: https://perritodeck.dev/download.html"
            echo
            echo "## Android signing certificate"
            echo
            echo "\`perrito-$VERSION.apk\` is signed with the PerritoDeck release key. Its certificate's SHA-256 fingerprint is:"
            echo
            echo "\`$CERT\`"
            echo
            echo "Check the APK with \`apksigner verify --print-certs perrito-$VERSION.apk\`: the \"certificate SHA-256 digest\" line must show the same value. keytool writes it in capitals with colons: \`$cert_colons\`."
            echo
            echo "## Android changes"
            echo
            cat "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            echo
          } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          repo="${{ github.repository }}"
          if draft=$(gh release view "$TAG" -R "$repo" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published. Its files are not replaced automatically; turn it back into a draft first if you really mean to."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber -R "$repo"
          else
            flags=(--draft --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "PerritoDeck $VERSION")
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" dist/* "${flags[@]}" -R "$repo"
          fi
          echo "Draft ready: review it under Releases, then press Publish." >> "$GITHUB_STEP_SUMMARY"
