name: Android

# docs/assets/**: LauncherIconTest compares the app's icons with their sources there.
on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", "scripts/**", "docs/assets/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", "scripts/**", "docs/assets/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests
        run: ../scripts/gradle-annotate.sh testDebugUnitTest
      - name: Lint
        run: ../scripts/gradle-annotate.sh lintDebug
      - name: Build debug APK
        run: ../scripts/gradle-annotate.sh assembleDebug
      # The release build as a tag would make it, minus the key: R8 shrinking and
      # lintVitalRelease run here, so a problem that only shows up there is caught before a tag.
      - name: Build release APK (unsigned)
        run: ../scripts/gradle-annotate.sh assembleRelease
      - name: Release APK size
        run: |
          size=$(stat -c %s app/build/outputs/apk/release/app-release-unsigned.apk)
          echo "Release APK (minified, unsigned): $((size / 1024)) KiB" >> "$GITHUB_STEP_SUMMARY"
          # IzzyOnDroid's usual size limit is 30 MB.
          if [ "$size" -gt 30000000 ]; then echo "::warning::The release APK is $size bytes, over IzzyOnDroid's usual 30 MB limit."; fi
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perrito-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
