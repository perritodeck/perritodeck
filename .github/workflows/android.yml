name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ../scripts/gradle-annotate.sh testDebugUnitTest
      - name: Lint
        run: ../scripts/gradle-annotate.sh lintDebug
      - name: Build debug APK
        run: ../scripts/gradle-annotate.sh assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: perrito-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
