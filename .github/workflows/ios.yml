name: iOS

# Pushes to main and pull requests run this through ci.yml, when ios/ or protocol/ (PerritoKit's
# tests read the fixtures) change (the list is there). Also weekly (Mondays, after the other
# weekly jobs) and by hand (Actions → iOS → Run workflow).
on:
  workflow_call:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

# A newer run for the same branch makes older runs pointless, but each push to main is
# checked in full (see ci.yml). The group starts with this workflow's own name and then has
# github.workflow, which is the caller's name ("CI") when ci.yml calls this: so this never
# shares ci.yml's group (a deadlock), and a CI run by hand and a run from this workflow's own
# Run workflow button don't cancel each other.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode version
        run: xcodebuild -version && swift --version

      # Protocol models, pairing links, pinning, layout maths and throttling; the
      # protocol fixtures are read from ../../protocol/fixtures.
      - name: PerritoKit tests
        working-directory: ios/PerritoKit
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build the app for the simulator (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Perrito.xcodeproj \
            -scheme Perrito \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
