name: Site check

# What took evi-ai.dev down unnoticed: its DNS records were switched to proxied, GitHub
# couldn't renew its certificate, and once that expired Cloudflare answered 526 for weeks.
# This fails long before the certificate runs out unless perritodeck.dev and www, and the
# catalogue the host's Look online downloads, come straight from GitHub Pages
# (docs/website.md, The domain). It skips itself while the Cloudflare Worker still serves the
# site, before the cutover.
#
# A workflow of its own, so it takes seconds rather than waiting on a Rust build, and no push
# can cancel it (a push to main touching host/ cancels the Host workflow's weekly run).

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No setup-python or pip install: the check is standard library only, and the runner's
      # python3 is enough.
      - name: perritodeck.dev is served by GitHub Pages
        run: python3 scripts/publish_site.py --check-live
