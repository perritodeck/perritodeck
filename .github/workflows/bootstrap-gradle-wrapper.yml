# Re-runnable job that generates the Gradle wrapper from the official Gradle distribution
# and pushes it to a new branch, gradle-wrapper-<version>, for a pull request. Run it again
# with a new version to upgrade Gradle. Start it from the branch the wrapper is for (usually
# main): the run's summary page links to a pull request from the new branch into that one.
# The commit is signed off (DCO) by github-actions[bot].
#
# It doesn't open the pull request itself, because that needs Settings → Actions → General
# → "Allow GitHub Actions to create and approve pull requests", which stays off
# (docs/launch-checklist.md). Open it from the link: a pull request a person opens starts
# the Android checks as usual.
name: Bootstrap Gradle wrapper

on:
  workflow_dispatch:
    inputs:
      gradle-version:
        description: Gradle version
        default: "8.14.3"
        required: true

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the branch
    env:
      # Through the environment, never pasted into a script.
      GRADLE_VERSION: ${{ inputs.gradle-version }}
    steps:
      - name: Check the input
        run: |
          if [[ ! "$GRADLE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-rc-[0-9]+)?$ ]]; then
            echo "::error::The Gradle version should look like 8.14.3 (or 9.0.0-rc-1)."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo "::error::Start this from a branch: the pull request goes into the branch it was started from."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ inputs.gradle-version }}
      - name: Generate the wrapper in an empty project
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          touch settings.gradle.kts
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/"
      # Check gradle-wrapper.jar against Gradle's published checksums before committing it.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Commit and push a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper
          if git diff --cached --quiet; then
            echo "The wrapper is already Gradle $GRADLE_VERSION; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="gradle-wrapper-$GRADLE_VERSION"
          # Exits 2 when there's no such branch.
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "::error::The branch $branch exists already: open or merge its pull request (or delete the branch), then run this again."
            exit 1
          fi
          # The version the docs name now, read before the commit replaces it.
          old="$(git show HEAD:android/gradle/wrapper/gradle-wrapper.properties 2> /dev/null |
            sed -n 's|^distributionUrl=.*/gradle-\(.*\)-bin\.zip$|\1|p')"
          git switch -c "$branch"
          git commit -s -m "build(android): Gradle wrapper $GRADLE_VERSION"
          git push origin "$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1"
          echo "Open the pull request: $compare"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Gradle wrapper $GRADLE_VERSION

          Pushed to \`$branch\`: **[open the pull request]($compare)** into \`$GITHUB_REF_NAME\`.
          gradle-wrapper.jar matched Gradle's published checksums in this run, and the Android
          checks run on the pull request once it's open.

          Before merging: check that fdroidserver's \`gradlew-fdroid\` knows Gradle
          $GRADLE_VERSION, and replace ${old:-the old version} with $GRADLE_VERSION in
          android/README.md, docs/fdroid/README.md and this workflow's default.
          EOF
