# One-off (re-runnable) job that generates the Gradle wrapper from the official Gradle
# distribution and commits it. Run it again with a new version to upgrade Gradle.
name: Bootstrap Gradle wrapper

on:
  workflow_dispatch:
    inputs:
      gradle-version:
        description: Gradle version
        default: "8.14.3"
        required: true

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: ${{ inputs.gradle-version }}
      - name: Generate wrapper in an empty project
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          touch settings.gradle.kts
          gradle wrapper --gradle-version "${{ inputs.gradle-version }}" --distribution-type bin
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/gradlew android/gradlew.bat android/gradle/wrapper
          git diff --cached --quiet && { echo "Wrapper unchanged"; exit 0; }
          git commit -m "build(android): Gradle wrapper ${{ inputs.gradle-version }}"
          git push
