[package]
name = "perritodeck-app"
description = "PerritoDeck desktop app: the host in your tray, with a window to pair tablets and see your buttons"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/perritodeck/perritodeck"
homepage = "https://perritodeck.dev"
publish = false

# Built on its own (it needs the system WebView), so the headless host workspace
# keeps building without GTK/WebKit.
[workspace]

[lib]
name = "perritodeck_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
perritodeck-host = { path = "../../crates/host" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Same patched enigo as the host workspace (see host/vendor/enigo/PERRITODECK.md).
[patch.crates-io]
enigo = { path = "../../vendor/enigo" }

[profile.release]
lto = "thin"
strip = true
