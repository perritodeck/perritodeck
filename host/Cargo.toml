[workspace]
resolver = "2"
exclude = ["vendor"]
members = ["crates/protocol", "crates/core", "crates/actions", "crates/render", "crates/profile", "crates/deck", "crates/integrations", "crates/host", "crates/fakedeck"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/perritodeck/perritodeck"
homepage = "https://perritodeck.dev"
rust-version = "1.80"

[workspace.dependencies]
perritodeck-protocol = { path = "crates/protocol" }
perritodeck-core = { path = "crates/core" }
perritodeck-actions = { path = "crates/actions" }
perritodeck-render = { path = "crates/render" }
perritodeck-profile = { path = "crates/profile" }
perritodeck-deck = { path = "crates/deck" }
perritodeck-integrations = { path = "crates/integrations" }
perritodeck-fakedeck = { path = "crates/fakedeck" }

anyhow = "1"
ab_glyph = "0.2"
tiny-skia = "0.11"
base64 = "0.23"
directories = "6"
if-addrs = "0.15"
mdns-sd = "0.21"
notify = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
enigo = "0.6"
open = "5"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "io-util"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny" # allowed only where an OS API needs it (host focus detection)

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Wayland input fixes; see vendor/enigo/PERRITODECK.md
[patch.crates-io]
enigo = { path = "vendor/enigo" }
