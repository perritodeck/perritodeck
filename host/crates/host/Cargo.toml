[package]
name = "perritodeck-host"
description = "PerritoDeck desktop host runtime and command-line host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "perritodeck-host"
path = "src/main.rs"

[dependencies]
perritodeck-core.workspace = true
perritodeck-actions.workspace = true
perritodeck-render.workspace = true
perritodeck-profile.workspace = true
perritodeck-deck.workspace = true
perritodeck-integrations.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
toml_edit.workspace = true
sha2.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
perritodeck-protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
directories.workspace = true
qrcode.workspace = true
gethostname.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[dev-dependencies]
tempfile.workspace = true
