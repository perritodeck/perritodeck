[package]
name = "perritodeck-mcp"
description = "Local MCP (Model Context Protocol) server: lets AI assistants see, press and make PerritoDeck keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

# The stdio bridge assistants start (src/main.rs, see src/cli.rs).
[[bin]]
name = "perritodeck-mcp"
path = "src/main.rs"

[dependencies]
perritodeck-actions.workspace = true
perritodeck-profile.workspace = true
base64.workspace = true
directories.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
