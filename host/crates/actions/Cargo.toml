[package]
name = "perritodeck-actions"
description = "Actions a PerritoDeck key can perform: hotkeys, text, media, URLs, apps, commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["system"]
# Real OS input (enigo) and URL/file opening. Disable for headless builds.
system = ["dep:enigo", "dep:open"]

[dependencies]
enigo = { workspace = true, optional = true }
open = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
