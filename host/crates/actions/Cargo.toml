[package]
name = "perritodeck-actions"
description = "Actions a PerritoDeck key can perform: hotkeys, text, media, URLs, apps, commands"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["system"]
# Real OS input (enigo) and URL/file opening. Disable for headless builds.
system = ["dep:enigo", "dep:open", "dep:windows"]

[dependencies]
enigo = { workspace = true, optional = true }
open = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Wayland: input through the desktop portal (asks permission once per host start).
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { workspace = true, optional = true, features = ["x11rb", "libei_tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[lints]
workspace = true
