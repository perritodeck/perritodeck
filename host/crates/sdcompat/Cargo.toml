[package]
name = "perritodeck-sdcompat"
description = "Runs Stream Deck plugins (.sdPlugin) on PerritoDeck tablets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
perritodeck-actions.workspace = true
perritodeck-deck.workspace = true
perritodeck-protocol.workspace = true
perritodeck-render.workspace = true
base64.workspace = true
futures-util.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }
open.workspace = true
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
serde.workspace = true
serde_json.workspace = true
# The OS version for plugins' `-info`.
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
rand.workspace = true
tracing.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
perritodeck-profile.workspace = true
tempfile.workspace = true

[lints]
workspace = true
