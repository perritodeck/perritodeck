<!doctype html>
<html><head><meta charset="utf-8"><title>Count up</title></head>
<body>
<label>Step <input id="step" type="number" value="1"></label>
<script>
// The Stream Deck app (or PerritoDeck) calls this once the page has loaded.
function connectElgatoStreamDeckSocket(port, uuid, registerEvent, info, actionInfo) {
  const ws = new WebSocket("ws://127.0.0.1:" + port);
  const action = JSON.parse(actionInfo);
  ws.onopen = () => ws.send(JSON.stringify({ event: registerEvent, uuid }));
  document.getElementById("step").value = action.payload.settings.step ?? 1;
  document.getElementById("step").onchange = (e) =>
    ws.send(JSON.stringify({ event: "setSettings", context: uuid, payload: { ...action.payload.settings, step: Number(e.target.value) } }));
}
</script>
</body></html>
