# XcodeGen spec for Perrito (iPhone and iPad). Generate the project with `xcodegen`
# in this folder; Perrito.xcodeproj is not committed.
name: Perrito
options:
  bundleIdPrefix: dev.perritodeck
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  # XcodeGen's default project format follows a newer Xcode (format 77, Xcode 16),
  # which Xcode 15 can't open; CI builds with Xcode 15.4 (macos-14).
  projectFormat: xcode15_3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PerritoKit:
    path: PerritoKit
targets:
  Perrito:
    type: application
    platform: iOS
    sources:
      - path: Perrito
    dependencies:
      - package: PerritoKit
        product: PerritoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.perritodeck.client
        PRODUCT_NAME: Perrito
        INFOPLIST_FILE: Perrito/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your own team in Xcode (Signing & Capabilities) to run on a device.
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
